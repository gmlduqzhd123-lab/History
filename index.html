    <meta property="og:description" content="역사, 직접 만나면 더 오래 기억돼요. 10개 역사 정거장과 자료 탐구·역사 일기로 함께하는 초등 5학년 역사 탐험.">

    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">

    <link rel="preload" href="fonts/NotoSerifKRVariable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/inquiry.css">
    <link rel="stylesheet" href="css/landing.css">
    <link rel="stylesheet" href="css/offline.css">
</head>
<body>
    <div id="app">
        <noscript>이 앱을 쓰려면 자바스크립트를 켜 주세요.</noscript>
    </div>
    <script type="module" src="js/app.js"></script>
    <script>
        // 앱이 쓰는 문법·기능을 모르는 오래된 브라우저에서는 빈 화면 대신 안내를 보여 줌 (iOS 14·크롬 86 이상 필요)
        (function () {
            var ok = true;
            try { new Function('var a = {}; return a?.b ?? 1n;'); } catch (e) { ok = false; }
            if (!('noModule' in HTMLScriptElement.prototype) || !Element.prototype.replaceChildren) ok = false;
            function show(title) {
                var app = document.getElementById('app');
                if (!app || app.querySelector('.hero, .topbar, .landing-header')) return;
                app.innerHTML = '<div class="card" style="margin-top:40px"><h2>' + title + '</h2>'
                    + (ok
                        ? '<p style="margin-top:10px">앱 파일을 읽지 못했어요. 인터넷 연결을 확인해 주세요. 오프라인 파일을 다시 준비했다면 새로고침해 주세요.</p>'
                        : '<p style="margin-top:10px">이 기기의 브라우저가 오래되어 앱을 열지 못했을 수 있어요.</p>'
                            + '<div class="note-line">📱 <b>아이패드·아이폰</b>: 설정 → 일반 → 소프트웨어 업데이트 (iOS 14 이상)</div>'
                            + '<div class="note-line">💻 <b>안드로이드·웨일북·PC</b>: 크롬, 웨일, 삼성 인터넷, 엣지를 최신 버전으로 업데이트한 뒤 다시 열어 주세요.</div>')
                    + '<p class="small muted" style="margin-top:10px">인터넷이 느리면 열리는 데 시간이 걸릴 수 있어요. 잠시 뒤 새로고침해 보세요.</p>'
                    + '<button class="btn" type="button" id="startup-reload">새로고침</button></div>';
                document.getElementById('startup-reload').onclick = function () { location.reload(); };
                if (ok && !document.getElementById('offline-status')) {
                    // 핵심 모듈만 지워진 경우에도 저장본 점검과 전체 재설치 안내를 사용할 수 있다.
                    try {
                        new Function('return import("./js/offline.js")')().then(function (offline) {
                            offline.prepareOffline(function () {});
                        }).catch(function () {});
                    } catch (e) {}
                }
            }
            if (!ok) show('앱을 열 수 없는 브라우저예요 😢');
            else setTimeout(function () { show('앱이 열리지 않고 있어요 😢'); }, 20000);
        })();
    </script>
</body>
</html>
